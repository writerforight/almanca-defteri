<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almanca Defteri</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1b; --soft: #6b6a66;
  --line: #e4e1d8; --accent: #b4441f; --tag: #f1e6d9; --warn: #8a5a00; --warn-bg: #fbefd2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --soft: #9c9a93;
    --line: #34332e; --accent: #e8794f; --tag: #2e2a24; --warn: #f0c46a; --warn-bg: #3a2f17;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 "Inter", system-ui, sans-serif; }
header { padding: 28px 24px 8px; max-width: 980px; margin: 0 auto; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.ozet { color: var(--soft); margin-top: 4px; }
nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 24px; max-width: 980px; margin: 0 auto; }
nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
nav button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
main { max-width: 980px; margin: 0 auto; padding: 0 24px 60px; }
input[type=search] { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font: inherit; margin-bottom: 18px; }
h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 26px 0 10px; }
.madde { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: baseline; }
.madde .konu { flex: 1; }
.madde .tarih { color: var(--soft); font-size: 13px; white-space: nowrap; }
.rozet { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--tag); white-space: nowrap; }
.rozet.cok { background: var(--accent); color: #fff; }
.not { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--warn);
  background: var(--warn-bg); padding: 1px 8px; border-radius: 6px; }
.oturum { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
.oturum summary { padding: 14px 16px; cursor: pointer; font-weight: 600; }
.oturum .icerik { padding: 0 18px 14px; }
.oturum h3 { font-size: 16px; margin: 16px 0 6px; color: var(--accent); }
.oturum ul { margin: 0; padding-left: 20px; }
.acik label { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.bos { color: var(--soft); padding: 20px 0; }
@media (max-width: 560px) { .madde { flex-wrap: wrap; } header, nav, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Almanca <span>Defteri</span></h1>
  <div class="ozet" id="ozet"></div>
</header>
<nav id="sekmeler"></nav>
<main>
  <input type="search" id="ara" placeholder="Ara… (ör. Passiv, begegnen)">
  <div id="alan"></div>
</main>
<script>
const VERI = {"bolumler": [{"ad": "Kökler", "maddeler": [{"konu": "stell-", "tarih": "2026-11-05", "tekrar": 1, "not": ""}]}, {"ad": "Dilbilgisi", "maddeler": [{"konu": "Konjunktiv I / indirekte Rede (könne, sei, habe; Distanz: behauptete, angeblich, Konj. II)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Passiv: Zeiten (würde gebaut, wäre gebaut worden, ist … worden)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Zustandspassiv vs. Vorgangspassiv", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Partizip I / Partizip II; geworden / worden / gewesen", "tarih": "2026-11-21", "tekrar": 1, "not": "Partizip I yüzeysel"}, {"konu": "Doppelperfekt (gegangen gewesen)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Futur II (Vermutung + abgeschlossen; Passiv; irreal)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Ein finites Verb pro Hauptsatz; Infinitiv Perfekt", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "sein: Präteritum, Konj. II, mit Modalverben (muss gewesen sein)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Passivfähigkeit (klappen ✗); Partizip II ohne ge- (missbraucht)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Maßfragen: wie viel + Nomen vs. wie + Adjektiv; es gibt vs. sind drin", "tarih": "2026-11-21", "tekrar": 1, "not": "yüzeysel"}, {"konu": "Auswahl aus einer Menge: von + Dativ (Pronomen) vs. Genitiv Plural (der roten)", "tarih": "2026-11-21", "tekrar": 1, "not": "yüzeysel"}, {"konu": "ein bisschen / etwas / ein wenig / ein paar", "tarih": "2026-11-21", "tekrar": 1, "not": "4 alıştırma AÇIK"}, {"konu": "Adjektiv als Adverb (unglaublich schön)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "Demonstrativpronomen", "tarih": "2026-11-21", "tekrar": 1, "not": "yüzeysel"}]}, {"ad": "Kelimeler / nesneler", "maddeler": [{"konu": "begehen, Begehung (≠ feiern)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "begegnen (+ Dativ, sein)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "geschlossen (schließen) ≠ geschossen (schießen)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "mittlerweile ≠ mittels", "tarih": "2026-11-21", "tekrar": 1, "not": ""}, {"konu": "çaydanlık (Teekanne / Wasserkocher)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}]}, {"ad": "Deyimler", "maddeler": [{"konu": "Man nehme … (Rezept-Konjunktiv)", "tarih": "2026-11-21", "tekrar": 1, "not": ""}]}], "acik": [{"bitti": false, "metin": "ein bisschen / etwas — 4 alıştırma (2026-11-21)"}], "oturumlar": [{"tarih": "2026-11-21", "md": "# 2026-11-21\n\n## 1. Konjunktiv I (Indirekte Rede)\n- *Er sagte, ich könne das nicht machen*: „könne“ wertet nicht ab, es berichtet nur; die Abwertung kommt aus dem Inhalt.\n- Distanz steigern: sagte (neutral) < behauptete / angeblich; Konjunktiv II (könnte) schafft leichte Distanz.\n- Register: eher schriftlich/formell (Nachrichten, Berichte, Rezept *Man nehme*), aber *sei*, *habe* auch gesprochen.\n- Ersatzform: Wenn Konj. I = Indikativ ist (*sie haben*), nimmt man Konj. II (*sie hätten*).\n\n**Beispiele**\n- *Der Minister sagte, er habe davon nichts gewusst.* — Bakan bundan haberi olmadığını söyledi.\n- *Sie erklärte, sie sei krank gewesen.* — Hasta olduğunu açıkladı.\n- *Laut Polizei sei der Täter durch das Fenster geflohen.* — Polise göre fail pencereden kaçmış.\n- *Er behauptete, er könne fließend Chinesisch.* — Akıcı Çince konuşabildiğini iddia etti (şüphe var).\n- *Angeblich habe sie das Geld nie bekommen.* — Güya parayı hiç almamış.\n- *Sie sagten, sie hätten keine Zeit.* — Vakitleri olmadığını söylediler (Ersatzform).\n- *Man nehme 200 g Mehl und zwei Eier.* — 200 g un ve iki yumurta alınız.\n\n## 2. Passiv und Zeiten\n- wurde gebaut → Konj. II *würde gebaut*; Vergangenheit: *wäre gebaut worden*; *würde gebaut worden sein* korrekt, aber schwer und selten.\n- Perfekt Passiv: ist + Partizip II + worden (nie *hat*).\n- geschlossen (schließen) ≠ geschossen (schießen).\n- *wurde geschlossen* = *ist geschlossen worden*: gleiche Bedeutung, nur Register.\n- Zustandspassiv (*war geschlossen*) ≠ Vorgangspassiv (*war geschlossen worden*).\n\n**Beispiele**\n- *Die Brücke wurde 1990 gebaut.* / *Die Brücke ist 1990 gebaut worden.* — Köprü 1990'da yapıldı (anlam aynı).\n- *Mit mehr Geld würde die Brücke schneller gebaut.* — Daha çok parayla köprü daha hızlı yapılırdı.\n- *Ohne den Streik wäre die Brücke längst gebaut worden.* — Grev olmasaydı köprü çoktan yapılmış olurdu.\n- *Der Laden wird um 20 Uhr geschlossen.* (Vorgang) — Dükkân saat 20'de kapatılır.\n- *Der Laden ist sonntags geschlossen.* (Zustand) — Dükkân pazarları kapalıdır.\n- *Als ich ankam, war die Tür schon geschlossen.* — Vardığımda kapı zaten kapalıydı (durum).\n- *Als ich ankam, war die Tür schon geschlossen worden.* — Vardığımda kapı çoktan kapatılmıştı (eylem, öncesinde).\n- *Der Jäger hat auf den Hirsch geschossen.* — Avcı geyiğe ateş etti (schießen!).\n\n## 3. Partizip und Passiv\n- Partizip I (gehend), Partizip II (gegangen); Partizip II zwischen Verb und Adjektiv („Teilhaber an beidem“).\n- geworden (Vollverb *werden*) / worden (Passivhilfsverb) / gewesen (*sein*).\n- Passiv mit *werden* (Vorgang) und mit *sein* (Zustand).\n- *Er ist gegangen*: Partizip II im Perfekt = Verbform; Zustands-Eindruck = historischer Rest. Doppelperfekt (*gegangen gewesen*): regional, nicht Standard.\n\n**Beispiele**\n- *das weinende Kind* — ağlayan çocuk (Partizip I = eylem sürüyor).\n- *Er kam singend nach Hause.* — Eve şarkı söyleyerek geldi.\n- *die geschlossene Tür* — kapalı / kapatılmış kapı (Partizip II = tamamlanmış).\n- *Er ist Ingenieur geworden.* — Mühendis oldu (werden = olmak).\n- *Er ist befördert worden.* — Terfi ettirildi (Passiv → worden).\n- *Er ist schon in Berlin gewesen.* — Berlin'de bulundu.\n- *Der Brief wird geschrieben.* (Vorgang) / *Der Brief ist geschrieben.* (Zustand) — Mektup yazılıyor / yazılmış durumda.\n\n## 4. Futur II\n- werden + Partizip II + haben/sein: *Er wird das gemacht haben*, *Er wird schon gegangen sein*.\n- Zwei Verwendungen: Vermutung über die Vergangenheit; in der Zukunft abgeschlossen.\n- Passiv: *Sie werden schon gemacht worden sein*; irreal: *Sie wären gemacht worden*.\n- „Plusquamperfekt der Zukunft“ gibt es nicht als eigene Zeit, Futur II deckt das ab.\n\n**Beispiele**\n- *Er ist nicht da – er wird den Zug verpasst haben.* — Burada değil, herhalde treni kaçırmıştır (tahmin).\n- *Sie wird schon nach Hause gegangen sein.* — Muhtemelen eve gitmiştir.\n- *Bis Freitag werde ich die Arbeit abgegeben haben.* — Cumaya kadar ödevi teslim etmiş olacağım.\n- *In zehn Jahren wird man das Problem gelöst haben.* — On yıl içinde sorun çözülmüş olacak.\n- *Bis morgen wird der Fehler behoben worden sein.* — Yarına kadar hata giderilmiş olacak (Passiv).\n\n## 5. Grundregel\n- Pro Satz (außer Nebensatz) nur ein finites Verb: *würden … war*, *wird … war* ungültig.\n- Der Infinitiv wird nicht konjugiert; seine Vergangenheit ist der Infinitiv Perfekt (*gewesen sein*).\n\n**Beispiele**\n- ✗ *Er würde kommen, war krank.* → ✓ *Er wäre gekommen, aber er war krank.* — Gelirdi ama hastaydı.\n- ✗ *Er wird krank war.* → ✓ *Er wird krank gewesen sein.* — Herhalde hastaydı.\n- ✓ *Er soll krank gewesen sein.* — Hasta olduğu söyleniyor.\n- ✓ *Ich glaube, dass er krank gewesen ist.* — Hasta olduğunu sanıyorum (Nebensatz: ikinci çekimli fiil serbest).\n\n## 6. sein\n- Präteritum: war, warst, war, waren, wart, waren; Konj. II: wäre …\n- Mit Modalverben: muss / kann / soll / will gewesen sein.\n- Drei Wurzeln: bin / ist / war, gewesen.\n\n**Beispiele**\n- *Wart ihr schon mal in Köln?* — Hiç Köln'de bulundunuz mu?\n- *Wenn ich du wäre, würde ich das nicht machen.* — Senin yerinde olsam bunu yapmazdım.\n- *Er muss sehr müde gewesen sein.* — Çok yorgun olmuş olmalı.\n- *Das kann nicht wahr gewesen sein.* — Bu doğru olmuş olamaz.\n- *Sie will Weltmeisterin gewesen sein.* — Dünya şampiyonu olduğunu iddia ediyor.\n\n## 7. Verbwahl\n- *klappen* hat kein Passiv; *missbrauchen* bildet Partizip II ohne ge-.\n- Allgemein: untrennbare Präfixe (be-, ver-, ent-, er-, zer-, miss-) → kein ge-.\n\n**Beispiele**\n- *Es hat geklappt!* — Oldu / işe yaradı! (✗ *Es wurde geklappt.*)\n- *Er hat seine Macht missbraucht.* — Gücünü kötüye kullandı.\n- *Das Vertrauen wurde missbraucht.* — Güven kötüye kullanıldı.\n- *Ich habe das nicht verstanden.* / *Wir haben Oma besucht.* — kein ge-.\n\n## 8. Maßfragen\n- wie viel kg, wie viel + Nomen (Menge) vs. wie + Adjektiv (wie groß, wie alt).\n- *es gibt* vs. *sind drin* (Frage nach dem Inhalt).\n\n**Beispiele**\n- *Wie viel wiegt der Koffer? – 23 Kilo.* — Bavul kaç kilo?\n- *Wie viel Zucker brauchen wir?* / *Wie viele Eier brauchen wir?* — sayılamayan vs. sayılan.\n- *Wie groß bist du?* / *Wie alt ist das Haus?* / *Wie lang ist der Fluss?*\n- *Gibt es hier in der Nähe eine Apotheke?* — Buralarda eczane var mı?\n- *Was ist in der Tasche drin?* — Çantanın içinde ne var?\n\n## 9. Auswahl aus einer Menge\n- welcher von uns, einer von euch beiden, eine der roten.\n- von + Dativ bei Pronomen (von uns, von euch) vs. Genitiv Plural bei Nomen/Adjektiven (der roten); bei Pronomen kein *der*.\n\n**Beispiele**\n- *Welcher von euch hat das Fenster offen gelassen?* — Hanginiz pencereyi açık bıraktı?\n- *Einer von uns muss fahren.* — Birimizin araba sürmesi lazım.\n- *Ich nehme eine der roten Tassen.* — Kırmızı fincanlardan birini alıyorum.\n- *Keiner der Studenten hat die Aufgabe gelöst.* — Öğrencilerden hiçbiri soruyu çözemedi.\n- *zwei meiner Freunde* = *zwei von meinen Freunden* — arkadaşlarımdan ikisi (Genitiv yazı dili, von gündelik).\n\n## 10. Wortschatz und Sonstiges\n- begehen (begehen/feiern/Begehung), begegnen (+ Dativ, mit *sein*).\n- ein bisschen / etwas / ein wenig / ein paar: Zählbarkeit, *etwas* als Pronomen, *ein bisschen* als Menge oder Adverb (*ein bisschen rote Karotte* vs. *ist ein bisschen rot*).\n- *unglaublich schön*: Adjektiv als Adverb ohne Endung.\n- mittlerweile (Zeit) ≠ mittels (Mittel); Demonstrativpronomen; çaydanlık.\n\n**Beispiele**\n- *Wir begehen heute unser zehnjähriges Jubiläum.* — Bugün onuncu yıl dönümümüzü kutluyoruz (resmî).\n- *Er hat einen schweren Fehler begangen.* — Ağır bir hata işledi.\n- *Die Begehung der Baustelle ist morgen.* — Şantiye denetimi yarın.\n- *Ich bin gestern meinem alten Lehrer begegnet.* — Dün eski öğretmenime rastladım (Dativ + sein).\n- *Kann ich ein bisschen Milch haben?* — Biraz süt alabilir miyim? (sayılamayan)\n- *Ich habe ein paar Fragen.* — Birkaç sorum var (sayılabilen).\n- *Hast du schon etwas gegessen?* — Bir şey yedin mi? (etwas = Pronomen)\n- *Das ist ein wenig teuer.* — Bu biraz pahalı (ein wenig = daha resmî).\n- *Das Konzert war unglaublich schön.* — Konser inanılmaz güzeldi.\n- *Mittlerweile wohne ich in Aachen.* — Artık / bu arada Aachen'de oturuyorum.\n- *Die Temperatur wird mittels eines Sensors gemessen.* — Sıcaklık bir sensör vasıtasıyla ölçülür.\n- *Der Film? Den habe ich schon gesehen.* — O filmi mi? Onu zaten gördüm (Demonstrativ).\n- *Kochst du Tee in der Teekanne oder im Wasserkocher?* — çaydanlık ≈ Teekanne / Teekessel.\n\n## Notlar\n- 3 (Partizip I), 8 ve 9 senin listenden; o sohbette yalnız madde başı olarak geçti, açıklaması yapılmadı → **yüzeysel**, tekrar edilebilir.\n- **Açık:** ein bisschen / etwas üzerine 4 alıştırma cevap bekliyor.\n"}]};
const SEKMELER = ["Konular", "Oturumlar", "Açık işler"];
let sekme = "Konular";
try { sekme = localStorage.getItem("sekme") || sekme; } catch (e) {}

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const satirIci = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");

function mdHtml(md) {
  let html = "", liste = false;
  for (const satir of md.split("\n")) {
    if (satir.startsWith("# ")) continue;
    if (satir.startsWith("- ")) {
      if (!liste) { html += "<ul>"; liste = true; }
      html += "<li>" + satirIci(satir.slice(2)) + "</li>";
      continue;
    }
    if (liste) { html += "</ul>"; liste = false; }
    if (satir.startsWith("## ")) html += "<h3>" + satirIci(satir.slice(3)) + "</h3>";
    else if (satir.trim()) html += "<p>" + satirIci(satir) + "</p>";
  }
  return html + (liste ? "</ul>" : "");
}

function ozet() {
  const n = VERI.bolumler.reduce((a, b) => a + b.maddeler.length, 0);
  const acik = VERI.acik.filter(a => !a.bitti).length;
  document.getElementById("ozet").textContent =
    `${n} konu · ${VERI.oturumlar.length} oturum · ${acik} açık iş`;
}

function sekmeleriCiz() {
  const nav = document.getElementById("sekmeler");
  nav.innerHTML = "";
  for (const ad of SEKMELER) {
    const b = document.createElement("button");
    b.textContent = ad;
    b.className = ad === sekme ? "on" : "";
    b.onclick = () => { sekme = ad; try { localStorage.setItem("sekme", ad); } catch (e) {} ciz(); };
    nav.appendChild(b);
  }
}

function ciz() {
  sekmeleriCiz();
  const q = document.getElementById("ara").value.trim().toLowerCase();
  const alan = document.getElementById("alan");
  let html = "";
  if (sekme === "Konular") {
    for (const b of VERI.bolumler) {
      const m = b.maddeler.filter(x => !q || (x.konu + " " + x.not).toLowerCase().includes(q));
      if (!m.length) continue;
      html += `<h2>${esc(b.ad)} · ${m.length}</h2>`;
      for (const x of m) {
        html += `<div class="madde"><div class="konu">${satirIci(x.konu)}` +
          (x.not ? `<br><span class="not">${esc(x.not)}</span>` : "") + `</div>` +
          `<span class="tarih">${esc(x.tarih)}</span>` +
          `<span class="rozet ${x.tekrar > 1 ? "cok" : ""}">${x.tekrar}×</span></div>`;
      }
    }
  } else if (sekme === "Oturumlar") {
    VERI.oturumlar.filter(o => !q || o.md.toLowerCase().includes(q)).forEach((o, i) => {
      html += `<details class="oturum" ${i === 0 ? "open" : ""}><summary>${esc(o.tarih)}</summary>` +
        `<div class="icerik">${mdHtml(o.md)}</div></details>`;
    });
  } else {
    const a = VERI.acik.filter(x => !q || x.metin.toLowerCase().includes(q));
    html += '<div class="acik">' + a.map(x =>
      `<label><input type="checkbox" disabled ${x.bitti ? "checked" : ""}> ${satirIci(x.metin)}</label>`).join("") + "</div>";
  }
  alan.innerHTML = html || '<div class="bos">Sonuç yok.</div>';
}

document.getElementById("ara").addEventListener("input", ciz);
ozet();
ciz();
</script>
</body>
</html>
